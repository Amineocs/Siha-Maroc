<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siha Maroc — Infirmier</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f8f7;color:#18302d}
main{max-width:680px;margin:auto;padding:18px 16px 105px}.head{margin:8px 2px 22px}.head h1{margin:0;font-size:25px}.muted{color:#71807e;font-size:14px}
.card{background:#fff;border:1px solid #e1e8e6;border-radius:18px;padding:16px;margin:11px 0}.card h3{margin:0 0 7px}.time{font-size:21px;font-weight:800}
.tag{display:inline-block;background:#edf6f3;color:#28675e;border-radius:20px;padding:5px 9px;font-size:12px;margin-top:8px}
button.action{width:100%;text-align:left;background:#fff;border:1px solid #e1e8e6;border-radius:16px;padding:16px;margin:8px 0;font:inherit;color:inherit}
button.action b{font-size:17px;display:block}button.action small{display:block;color:#71807e;margin-top:5px}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#26786e;color:#fff;font-weight:800;font-size:16px;margin-top:10px}
.secondary{width:100%;border:1px solid #dce5e3;border-radius:14px;padding:13px;background:#fff;font-weight:700;margin-top:8px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #d7e0de;border-radius:11px;padding:12px;font:inherit;background:#fff}textarea{min-height:80px}
.back{border:0;background:none;font-size:31px;padding:0 12px 0 0}.titlebar{display:flex;align-items:center;margin-bottom:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #e1e7e6;padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;z-index:10}
.bottom button{flex:1;border:0;background:none;color:#667674;font-size:11px;padding:5px}.bottom span{display:block;font-size:21px;margin-bottom:2px}
.feed{border-left:2px solid #d8e5e2;margin:15px 0 0 8px;padding-left:15px}.feed .card{position:relative}.feed .card:before{content:"";position:absolute;left:-21px;top:19px;width:9px;height:9px;border-radius:50%;background:#26786e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #e1e8e6;border-radius:15px;padding:14px}.stat strong{font-size:25px;display:block}
</style></head><body><main id="app"></main>
<script>
const AP='nurse_v4_appts',JR='nurse_v4_journal';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const dateKey=()=>{let d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`};
function seed(){if(localStorage.getItem('nurse_v4_seed'))return;let a={};a[dateKey()+'|09:00']={name:'Amina Benali',care:'Pansement postopératoire',place:'Cabinet',state:'À faire'};a[dateKey()+'|14:30']={name:'Omar Alaoui',care:'Injection prescrite',place:'Domicile',state:'À faire'};save(AP,a);localStorage.setItem('nurse_v4_seed','1')}
function nav(){return `<nav class="bottom"><button onclick="today()"><span>☀️</span>Aujourd’hui</button><button onclick="planning()"><span>📅</span>Planning</button><button onclick="requests()"><span>🔔</span>Demandes</button><button onclick="patients()"><span>👥</span>Patients</button></nav>`}
function show(x){app.innerHTML=x+nav()}function head(t,b){return `<div class="titlebar">${b?`<button class="back" onclick="${b}">‹</button>`:''}<div><h1 style="margin:0">${t}</h1><div class="muted">Espace infirmier</div></div></div>`}
function todays(){return Object.entries(load(AP,{})).filter(([k])=>k.startsWith(dateKey()+'|')).sort()}
function today(){let r=todays(),done=r.filter(z=>z[1].state==='Soin réalisé').length;show(head('Mes soins aujourd’hui')+`<div class="grid"><div class="stat"><strong>${r.length}</strong><span class="muted">prévus</span></div><div class="stat"><strong>${done}</strong><span class="muted">réalisés</span></div></div>`+r.map(([k,x])=>`<button class="action" onclick="careCard('${k}')"><b>${k.split('|')[1]} · ${x.care}</b><small>${x.name} · ${x.place}</small><span class="tag">${x.state}</span></button>`).join(''))}
function planning(){let r=Object.entries(load(AP,{})).sort();show(head('Planning')+`<button class="primary" onclick="add()">＋ Ajouter un soin</button>`+r.map(([k,x])=>`<button class="action" onclick="careCard('${k}')"><b>${k.replace('|',' · ')} · ${x.care}</b><small>${x.name} · ${x.place} · ${x.state}</small></button>`).join(''))}
function add(){let n=prompt('Nom du patient');if(!n)return,d=prompt('Date',dateKey())||dateKey(),t=prompt('Heure','10:00')||'10:00',c=prompt('Soin','Pansement')||'Soin infirmier',a=load(AP,{});a[d+'|'+t]={name:n,care:c,place:'Cabinet',state:'À faire'};save(AP,a);planning()}
function careCard(k){let x=load(AP,{})[k];if(!x)return;let [d,t]=k.split('|');show(head('Soin',`planning()`)+`<div class="card"><div class="time">${t}</div><h3>${x.care}</h3><div>${x.name}</div><div class="muted">${d} · ${x.place}</div><span class="tag">${x.state}</span></div><button class="primary" onclick="formCare('${k}')">🩺 ${x.state==='Soin réalisé'?'Ajouter une observation':'Réaliser le soin'}</button><button class="action" onclick="journal('${x.name}')"><b>📖 Journal</b><small>Voir les soins et observations précédents</small></button><button class="action" onclick="doc('${x.name}')"><b>📎 Document / photo</b><small>Ajouter un élément utile au suivi</small></button>`)}
function formCare(k){let x=load(AP,{})[k],[d,t]=k.split('|');show(head('Réaliser le soin',`careCard('${k}')`)+`<div class="card"><b>${x.care}</b><div class="muted">${x.name} · ${d} · ${t}</div></div><label>Acte effectué</label><textarea id="act">${x.care}</textarea><label>Constantes — seulement si nécessaires</label><input id="vit" placeholder="TA, pouls, température…"><label>Observation</label><textarea id="obs"></textarea><label>Incident / particularité</label><textarea id="inc"></textarea><label>Évolution</label><textarea id="evo"></textarea><label>Prochain soin</label><input id="nxt" placeholder="Ex. demain matin"><button class="primary" onclick="validateCare('${k}')">✓ Terminer le soin</button>`)}
function validateCare(k){let a=load(AP,{}),x=a[k],[d,t]=k.split('|'),j=load(JR,[]);j.unshift({id:Date.now(),patient:x.name,type:'Soin réalisé',created:new Date().toLocaleString('fr-FR'),day:d,time:t,act:act.value,vitals:vit.value,obs:obs.value,incident:inc.value,evo:evo.value,next:nxt.value});save(JR,j);x.state='Soin réalisé';a[k]=x;save(AP,a);journal(x.name)}
function journal(name){let j=load(JR,[]).filter(x=>x.patient===name).sort((a,b)=>b.id-a.id);show(head('Journal',`patients()`)+`<div class="card"><h3>${name}</h3><div class="muted">Suivi infirmier · plus récent en haut</div></div><button class="secondary" onclick="doc('${name}')">📎 Ajouter document / photo</button><div class="feed">`+(j.length?j.map(x=>`<div class="card"><b>${x.type}</b><div class="muted">${x.created}</div>${x.act?`<p><b>Acte :</b> ${x.act}</p>`:''}${x.vitals?`<p><b>Constantes :</b> ${x.vitals}</p>`:''}${x.obs?`<p><b>Observation :</b> ${x.obs}</p>`:''}${x.incident?`<p><b>Incident :</b> ${x.incident}</p>`:''}${x.evo?`<p><b>Évolution :</b> ${x.evo}</p>`:''}${x.fileName?`<p>📎 ${x.fileName}</p>`:''}</div>`).join(''):`<div class="card muted">Aucun soin enregistré.</div>`)+`</div>`)}
function patients(){let a=load(AP,{}),j=load(JR,[]),n=[...new Set([...Object.values(a).map(x=>x.name),...j.map(x=>x.patient)])].sort();show(head('Patients')+n.map(x=>`<button class="action" onclick="journal('${x}')"><b>${x}</b><small>Ouvrir le journal</small></button>`).join(''))}
function requests(){show(head('Demandes')+`<div class="card"><h3>Soin à domicile</h3><p>Injection prescrite</p><div class="muted">Demande au plus tôt</div><button class="primary" onclick="alert('Demande acceptée')">Accepter</button></div><div class="card"><h3>Soin programmé</h3><p>Pansement</p><div class="muted">Demain matin</div><button class="secondary">Voir</button></div>`)}
function doc(name){show(head('Document / photo',`journal('${name}')`)+`<div class="card"><b>${name}</b><div class="muted">Ajouter uniquement un élément utile au suivi infirmier.</div></div><label>Type</label><select id="typ"><option>Photo de soin</option><option>Ordonnance</option><option>Compte rendu</option><option>Analyse</option><option>Autre</option></select><label>Choisir ou prendre une photo</label><input id="file" type="file" accept="image/*,.pdf" onchange="prep('${name}')"><div id="prep"></div>`)}
function prep(name){let f=file.files[0];if(!f)return;prep.innerHTML=`<label>Nom du document</label><input id="fname" value="${f.name.replace(/\.[^.]+$/,'')}"><button class="primary" onclick="saveDoc('${name}')">Ajouter au journal</button>`}
function saveDoc(name){let f=file.files[0],r=new FileReader();r.onload=()=>{let j=load(JR,[]);j.unshift({id:Date.now(),patient:name,type:typ.value,created:new Date().toLocaleString('fr-FR'),fileName:fname.value||f.name,dataUrl:r.result,mime:f.type});try{save(JR,j)}catch(e){alert('Fichier trop volumineux pour ce prototype.');return}journal(name)};r.readAsDataURL(f)}
seed();today();
</script></body></html>
