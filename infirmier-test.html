<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siha Maroc — Infirmier</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f8f7;color:#18302d}
main{max-width:680px;margin:auto;padding:18px 16px 105px}.head{margin:8px 2px 22px}.head h1{margin:0;font-size:25px}.muted{color:#71807e;font-size:14px}
.card{background:#fff;border:1px solid #e1e8e6;border-radius:18px;padding:16px;margin:11px 0}.card h3{margin:0 0 7px}.time{font-size:21px;font-weight:800}
.tag{display:inline-block;background:#edf6f3;color:#28675e;border-radius:20px;padding:5px 9px;font-size:12px;margin-top:8px}
button.action{width:100%;text-align:left;background:#fff;border:1px solid #e1e8e6;border-radius:16px;padding:16px;margin:8px 0;font:inherit;color:inherit}
button.action b{font-size:17px;display:block}button.action small{display:block;color:#71807e;margin-top:5px}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#26786e;color:#fff;font-weight:800;font-size:16px;margin-top:10px}
.secondary{width:100%;border:1px solid #dce5e3;border-radius:14px;padding:13px;background:#fff;font-weight:700;margin-top:8px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #d7e0de;border-radius:11px;padding:12px;font:inherit;background:#fff}textarea{min-height:80px}
.back{border:0;background:none;font-size:31px;padding:0 12px 0 0}.titlebar{display:flex;align-items:center;margin-bottom:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #e1e7e6;padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;z-index:10}
.bottom button{flex:1;border:0;background:none;color:#667674;font-size:11px;padding:5px}.bottom span{display:block;font-size:21px;margin-bottom:2px}
.feed{border-left:2px solid #d8e5e2;margin:15px 0 0 8px;padding-left:15px}.feed .card{position:relative}.feed .card:before{content:"";position:absolute;left:-21px;top:19px;width:9px;height:9px;border-radius:50%;background:#26786e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #e1e8e6;border-radius:15px;padding:14px}.stat strong{font-size:25px;display:block}
</style></head><body><main id="app"><div class="head"><h1>Mes soins aujourd’hui</h1><p class="muted">Siha Maroc · Espace infirmier</p></div><div class="card">Chargement de votre planning…</div></main>
<script>
'use strict';
const KEY='siha_nurse_v7', LOG='siha_nurse_v7_log', PRO='siha_nurse_v7_profile';
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}};
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const appointments=()=>get(KEY,{}),journal=()=>get(LOG,[]);
let selected=new Date(), currentPatient='', backView='agenda';
function init(){if(!localStorage.getItem('siha_nurse_v7_seed')){let a={};a[dayKey()+'|09:00']={name:'Amina Benali',care:'Pansement postopératoire',place:'Cabinet',state:'Prévu'};a[dayKey()+'|14:30']={name:'Omar Alaoui',care:'Injection prescrite',place:'Domicile',state:'Prévu'};put(KEY,a);localStorage.setItem('siha_nurse_v7_seed','1')}today()}
function nav(active){return `<nav class="bottom">${[['today','☀️','Aujourd’hui'],['agenda','📅','Agenda'],['requests','📨','Demandes'],['home','🏠','Domicile'],['profile','👤','Profil']].map(([k,i,t])=>`<button style="${k===active?'color:#176b62;font-weight:800':''}" onclick="${k}()"><span>${i}</span>${t}</button>`).join('')}</nav>`}
function render(title,body,active,back){document.getElementById('app').innerHTML=`<div class="titlebar">${back?`<button class="back" onclick="${back}">‹</button>`:''}<div><h1 style="margin:0">${title}</h1><div class="muted">Siha Maroc · Espace infirmier</div></div></div>${body}${nav(active)}`}
function today(){let rows=Object.entries(appointments()).filter(([k])=>k.startsWith(dayKey()+'|')).sort(([a],[b])=>a.localeCompare(b));render('Aujourd’hui',`<div class="grid"><div class="stat"><strong>${rows.length}</strong><span class="muted">Soins prévus</span></div><div class="stat"><strong>${rows.filter(([,x])=>x.state==='Soin réalisé').length}</strong><span class="muted">Réalisés</span></div></div><h3>Soins du jour</h3>${rows.length?rows.map(([k,x])=>`<button class="action" onclick="patient('${k}','today')"><b>${k.split('|')[1]} · ${esc(x.name)}</b><small>${esc(x.care)} · ${esc(x.place)} · ${x.state}</small></button>`).join(''):'<div class="card">Aucun soin prévu aujourd’hui.</div>'}<button class="secondary" onclick="patients()">🔎 Rechercher / ajouter un patient</button>`,'today')}
function agenda(delta){if(delta)selected=new Date(selected.getFullYear(),selected.getMonth()+delta,1);let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),end=new Date(y,m+1,0).getDate(),a=appointments();let h=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><button class="secondary" style="width:auto" onclick="agenda(-1)">‹</button><b>${selected.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class="secondary" style="width:auto" onclick="agenda(1)">›</button></div><div class="calendar">${['L','M','M','J','V','S','D'].map(t=>`<small>${t}</small>`).join('')}`;for(let i=0;i<(first.getDay()+6)%7;i++)h+='<span></span>';for(let n=1;n<=end;n++){let k=`${pad(n)}/${pad(m+1)}/${y}`,count=Object.keys(a).filter(x=>x.startsWith(k+'|')).length;h+=`<button class="calday ${k===dayKey()?'now':''}" onclick="day('${k}')">${n}${count?'<i>●</i>':''}</button>`}h+='</div><p class="muted">● Journée avec soins planifiés</p></div>';render('Agenda',h+`<button class="secondary" onclick="patients()">🔎 Rechercher / ajouter un patient</button>`,'agenda')}
function day(d){let rows=Object.entries(appointments()).filter(([k])=>k.startsWith(d+'|')).sort(([a],[b])=>a.localeCompare(b));render(d,`<div class="card"><b>${rows.length} soin(s) planifié(s)</b></div>${rows.map(([k,x])=>`<button class="action" onclick="patient('${k}','day')"><b>${k.split('|')[1]} · ${esc(x.name)}</b><small>${esc(x.care)} · ${esc(x.place)} · ${x.state}</small></button>`).join('')}<button class="primary" onclick="newAppointment('${d}')">＋ Ajouter un patient / soin</button>`,'agenda','agenda()')}
function patients(q=''){let all=[...new Set([...Object.values(appointments()).map(x=>x.name),...journal().map(x=>x.patient)])].sort();render('Patients',`<input id="search" placeholder="Rechercher nom ou téléphone" value="${esc(q)}" oninput="filterPatients(this.value)"><div id="patientResults">${patientResults(all,q)}</div><button class="primary" onclick="newAppointment('${dayKey()}')">＋ Ajouter un patient</button>`,'profile')}
function patientResults(all,q){return all.filter(x=>x.toLowerCase().includes(q.toLowerCase())).map(n=>`<button class="action" onclick="historyByName(decodeURIComponent('${encodeURIComponent(n)}'))"><b>${esc(n)}</b><small>Journal des soins</small></button>`).join('')||'<div class="card">Aucun patient trouvé.</div>'}
function filterPatients(q){let all=[...new Set([...Object.values(appointments()).map(x=>x.name),...journal().map(x=>x.patient)])].sort();document.getElementById('patientResults').innerHTML=patientResults(all,q)}
function newAppointment(d){render('Ajouter un soin',`<div class="card"><label>Patient</label><input id="pn" placeholder="Nom et prénom" required><label>Téléphone</label><input id="phone" type="tel" placeholder="06..."><label>Date</label><input id="date" type="date" value="${d.split('/').reverse().join('-')}"><label>Heure</label><input id="hour" type="time" value="10:00"><label>Type de soin</label><select id="care"><option>Pansement</option><option>Injection</option><option>Prélèvement</option><option>Surveillance</option><option>Autre soin</option></select><label>Lieu</label><select id="place"><option>Cabinet</option><option>Domicile</option></select><button class="primary" onclick="saveAppointment()">Enregistrer</button></div>`,'agenda','agenda()')}
function saveAppointment(){let name=document.getElementById('pn').value.trim(),d=document.getElementById('date').value,t=document.getElementById('hour').value;if(!name||!d||!t)return alert('Renseignez le patient, la date et l’heure.');let key=d.split('-').reverse().join('/')+'|'+t,a=appointments();if(a[key])return alert('Ce créneau est déjà occupé.');a[key]={name,phone:document.getElementById('phone').value,care:document.getElementById('care').value,place:document.getElementById('place').value,state:'Prévu'};put(KEY,a);day(key.split('|')[0])}
function patient(k,from){let x=appointments()[k];if(!x)return;backView=from;let [d,t]=k.split('|');render('Soin infirmier',`<div class="card"><h2>${esc(x.name)}</h2><b>${esc(x.care)}</b><p class="muted">${d} · ${t} · ${esc(x.place)} · ${x.state}</p></div><button class="primary" onclick="careForm('${k}')">${x.state==='Soin réalisé'?'＋ Nouvelle note de suivi':'✓ Réaliser le soin'}</button><button class="action" onclick="historyByName(decodeURIComponent('${encodeURIComponent(x.name)}'))"><b>📖 Journal</b><small>Soins, observations et documents du patient</small></button><button class="action" onclick="upload(decodeURIComponent('${encodeURIComponent(x.name)}'))"><b>📎 Document / photo</b></button>`,'agenda',from==='today'?'today()':`day('${d}')`)}
function careForm(k){let x=appointments()[k];render('Fiche de soin',`<div class="card"><b>${esc(x.name)} · ${esc(x.care)}</b><p class="muted">${k.replace('|',' · ')}</p></div><label>Acte effectué</label><textarea id="act">${esc(x.care)}</textarea><label>Constantes si nécessaires</label><input id="vitals" placeholder="TA, pouls, température…"><label>Observations</label><textarea id="obs"></textarea><label>Incident / particularité</label><textarea id="incident"></textarea><label>Évolution</label><textarea id="evo"></textarea><label>Prochain soin</label><input id="next"><button class="primary" onclick="finish('${k}')">✓ Valider le soin</button>`,'agenda',`patient('${k}','day')`)}
function finish(k){let a=appointments(),x=a[k],v=id=>document.getElementById(id).value;j=journal();j.unshift({id:Date.now(),patient:x.name,type:'Soin réalisé',at:new Date().toLocaleString('fr-FR'),act:v('act'),vitals:v('vitals'),obs:v('obs'),incident:v('incident'),evo:v('evo'),next:v('next')});put(LOG,j);x.state='Soin réalisé';put(KEY,a);historyByName(x.name)}
function historyByName(n){currentPatient=n;let rows=journal().filter(x=>x.patient===n).sort((a,b)=>b.id-a.id);render('Journal',`<div class="card"><h2>${esc(n)}</h2><p class="muted">Le plus récent en haut</p></div><button class="secondary" onclick="upload(decodeURIComponent('${encodeURIComponent(n)}'))">📎 Ajouter un document / photo</button><div class="feed">${rows.length?rows.map(x=>`<div class="card"><b>${esc(x.type)}</b><p class="muted">${esc(x.at)}</p>${['act','vitals','obs','incident','evo','next'].filter(k=>x[k]).map(k=>`<p><b>${({act:'Acte',vitals:'Constantes',obs:'Observation',incident:'Incident',evo:'Évolution',next:'Prochain soin'})[k]} :</b> ${esc(x[k])}</p>`).join('')}${x.fileName?`<button class="secondary" onclick="viewFile(${x.id})">📎 ${esc(x.fileName)}</button>`:''}</div>`).join(''):'<div class="card">Aucun soin enregistré.</div>'}</div>`,'profile','patients()')}
function upload(n){currentPatient=n;render('Document / photo',`<div class="card"><b>${esc(n)}</b></div><label>Type</label><select id="typ"><option>Photo de soin</option><option>Ordonnance</option><option>Compte rendu</option><option>Analyse</option><option>Autre</option></select><label>Choisir le fichier</label><input type="file" id="file" accept="image/*,.pdf" onchange="prepare()"><div id="ready"></div>`,'profile',`historyByName(currentPatient)`)}
function prepare(){let f=document.getElementById('file').files[0];if(!f)return;document.getElementById('ready').innerHTML=`<label>Nom du fichier</label><input id="fname" value="${esc(f.name.replace(/\.[^.]+$/,''))}"><button class="primary" onclick="saveFile()">Intégrer au journal</button>`}
function saveFile(){let f=document.getElementById('file').files[0],name=currentPatient,r=new FileReader();if(!f)return;r.onload=()=>{let j=journal();j.unshift({id:Date.now(),patient:name,type:document.getElementById('typ').value,at:new Date().toLocaleString('fr-FR'),fileName:document.getElementById('fname').value||f.name,mime:f.type,dataUrl:r.result});try{put(LOG,j)}catch(e){alert('Fichier trop volumineux pour le stockage local.');return}historyByName(name)};r.readAsDataURL(f)}
function viewFile(id){let x=journal().find(z=>z.id===id);if(!x)return;render(esc(x.fileName),`<div class="card">${x.mime.startsWith('image/')?`<img style="max-width:100%;height:auto" src="${x.dataUrl}">`:`<iframe title="Document" style="width:100%;height:65vh" src="${x.dataUrl}"></iframe>`}</div>`,'profile',`historyByName(currentPatient)`)}
function requests(){render('Demandes',`<div class="card"><b>Demandes de soins</b><p class="muted">Démonstration : aucune demande reçue depuis le serveur.</p></div>`,'requests')}
function home(){render('Services à domicile',`<div class="card"><h3>Mes interventions à domicile</h3><p class="muted">Configurer les zones et consulter les soins à domicile planifiés.</p></div>${Object.entries(appointments()).filter(([,x])=>x.place==='Domicile').map(([k,x])=>`<button class="action" onclick="patient('${k}','day')"><b>${esc(x.name)}</b><small>${k.replace('|',' · ')} · ${esc(x.care)}</small></button>`).join('')}<button class="secondary" onclick="profile()">Configurer mes zones</button>`,'home')}
function profile(){let p=get(PRO,{name:'Infirmier de démonstration',zone:'Rabat',phone:''});render('Profil professionnel',`<div class="card"><label>Nom</label><input id="profName" value="${esc(p.name)}"><label>Zone d’intervention</label><input id="profZone" value="${esc(p.zone)}"><label>Téléphone</label><input id="profPhone" value="${esc(p.phone)}"><button class="primary" onclick="put(PRO,{name:document.getElementById('profName').value,zone:document.getElementById('profZone').value,phone:document.getElementById('profPhone').value});alert('Profil enregistré')">Enregistrer</button></div><button class="secondary" onclick="patients()">🔎 Rechercher / ajouter un patient</button>`,'profile')}
window.addEventListener('DOMContentLoaded',init);
</script><style>.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;margin-top:16px}.calday{min-height:47px;border:1px solid #dce6e3;background:#fff;border-radius:10px;color:#18302d}.calday.now{border:2px solid #26786e;font-weight:800}.calday i{display:block;color:#26786e;font-size:10px;font-style:normal}.feed{border-left:2px solid #dce6e3;padding-left:15px}</style></body></html>
